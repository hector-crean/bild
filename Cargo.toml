[workspace]
resolver = "3"
edition = "2024"
members = [ 
    "apps/*",
    "crates/*"
    ]
exclude = ["crates/input"]

[workspace.package]
version = "0.1.0"
authors = ["Hector Crean <hectorcrean@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"


[workspace.lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"


[workspace.dependencies]
bild_canvas = { path = "apps/bild_canvas" }
bild_core = { path = "crates/bild_core" }
camera = { path = "crates/camera" }
block3d_core = { path = "crates/block3d_core" }
grid_2d = { path = "crates/grid_2d" }
block3d_algorithm = { path = "crates/block3d_algorithm" }
ui = { path = "crates/ui" }
geometry = { path = "crates/geometry" }
compute = { path = "crates/compute" }
interaction = { path = "crates/interaction" }
infinite_grid = { path = "crates/infinite_grid" }
circuit_physics_core ={ path = "crates/circuit_physics_core" }


bevy = { version = "0.17.3", features = [
    "wayland",
    "experimental_bevy_feathers",
    "shader_format_wesl"
] }
bevy_render = {  version = "0.17.3"}
bevy_derive = { version = "0.17.3"}
bevy_macro_utils = {  version = "0.17.3"}

web-time = "1.1.0"




# bevy = { path = "../bevy", features = ["shader_format_wesl"] }
leafwing-input-manager = { version = "0.19.0"}
ts-rs = { version = "10.1.0", features = ["serde-compat", "bytes",  "chrono", "serde_json", "serde-json-impl", "tokio", "url", "uuid", "uuid-impl", "chrono-impl"] }
futures = "0.3.31"
futures-timer = "3.0.3"
schemars = "0.9.0"
wesl = { version = "0.1.2", features = ["package", "generics", "serde"] }
rand = { version = "0.8.5", features = ["small_rng"] }
getrandom = { version = "0.2.15", features = ["js"] }
uom = { version = "0.36.0", features = ["serde"] }
async-compat = "0.2.5"

thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
tracing-test = "0.2.5"
tracing = "0.1.41"
atomicow = "1.1.0"
rfd = "0.15.3"
ron = "0.10.1"
variadics_please = "1.0"
serde_json = { version = "1.0.116" }
crossbeam-channel = "0.5.12"
color-eyre = "0.6.3"
itertools = "0.13.0"
image = "0.24"
bitflags = "2.4"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
bincode = "2.0.0-rc.3"
bytemuck = "1.14"
bevy_asset_loader = "0.22.0"
bevy_web_asset = { version = "0.9"}
reqwest = { version = "0.12.7", features = ["json"] }
uuid = { version = "1.1.2", features = ["v4", "serde"] }
chrono = { version = "0.4.39", features = ["serde"] }
geojson = { version = "0.24.1"}
once_cell = "1.19.0"




# Simulation dependencies
rayon = "1.8"
wgpu = "0.19"
num_cpus = "1.16"

# Database
sqlx = { version = "0.8.2", features = [
    "runtime-tokio-rustls",
    "uuid",
    "time",
    "chrono",
    "postgres",
    "macros"
]}

# Utils
dotenv = "0.15.0"
walkdir = "2.3.3"
rand_chacha = "0.3.1"
rand_core = { version = "0.6.4", features = ["std"] }
tokio = { version = "1.40.0", features = ["full", "sync"] }
url = "2.5.4"
petgraph = "0.6.5"
urlencoding = "2.1.3"
wiremock = "0.5"



bevy-inspector-egui = "0.35.0"